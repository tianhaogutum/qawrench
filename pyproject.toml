[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "qawrench"
version = "0.1.0"
description = "Make browser/E2E CI trustworthy: flaky-test history, HAR replay fixes, pytest state leaks, MSW mock contracts, a11y baselines, Mermaid path appendices, Lighthouse noise gates, trace budgets, stable page diffs, link-check SARIF and crawl audits — one offline CLI."
# README.md with repository-relative links rewritten for PyPI (see tool.hatch.metadata.hooks below).
dynamic = ["readme"]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
authors = [{ name = "tianhaogutum" }]
keywords = [
    "qa", "e2e", "ci", "playwright", "flaky-tests", "har", "accessibility", "axe", "pa11y",
    "lighthouse", "web-performance", "sarif", "link-checker", "lychee", "html-diff",
    "structured-data", "json-ld", "crawlee", "parquet", "crawler", "robots-txt", "pytest", "test-pollution",
    "msw", "openapi", "contract-testing", "mermaid", "devtools", "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
    "Framework :: Pytest",
]
# The base install is standard library only; heavier dependencies are per-command extras.
dependencies = []

[project.optional-dependencies]
# crawlee-export: typed Parquet writing and read-back verification
parquet = ["pyarrow>=17"]
# structured-data: JSON-LD / OpenGraph extraction and HTML parsing
# structured-data mirrors extruct 0.18 selector behaviour, so stay within that minor series.
structured = ["extruct>=0.18,<0.19", "lxml>=5.3"]
# page-diff: HTML parsing and CSS selectors
html = ["beautifulsoup4>=4.13", "soupsieve>=2.6"]
# frontier: URL canonicalization for opt-in query sorting
frontier = ["w3lib>=2.1"]
# msw-contract: OpenAPI YAML loading and JSON Schema validation (handlers themselves run in Node)
openapi = ["PyYAML>=6.0.1", "jsonschema>=4.18"]
# statewatch: the opt-in pytest plugin (inactive until `pytest --statewatch POLICY.json`)
statewatch = ["pytest>=8.2,<10", "deepdiff>=8.6,<9", "pytest-replay>=1.7,<2", "filelock>=3.16,<4"]
all = ["qawrench[parquet,structured,html,frontier,openapi,statewatch]"]
# Everything the test suite imports: pytest, every extra, and schema validation for a11y.
test = [
    "qawrench[all]",
    "pytest>=8.4",
    "jsonschema>=4.23",
    "rfc3986-validator>=0.1.1",
]

[project.urls]
Homepage = "https://github.com/tianhaogutum/qawrench"
Repository = "https://github.com/tianhaogutum/qawrench"
Issues = "https://github.com/tianhaogutum/qawrench/issues"
Documentation = "https://github.com/tianhaogutum/qawrench/tree/main/docs"

[project.scripts]
qawrench = "qawrench.cli:main"

# The statewatch pytest plugin is registered whenever qawrench is installed, but it only
# imports pytest at load time and does nothing unless `--statewatch POLICY.json` is passed.
[project.entry-points.pytest11]
statewatch = "qawrench.statewatch.plugin"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# <img src>, <source srcset>: raw file URLs so the images render
pattern = '(src|srcset)="(?!https?://)([^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/tianhaogutum/qawrench/main/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?://|#|mailto:)([^"]+)"'
replacement = 'href="https://github.com/tianhaogutum/qawrench/blob/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# Markdown images, then Markdown links to files and directories
pattern = '!\[([^\]]*)\]\((?!https?://)([^)\s]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/tianhaogutum/qawrench/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/tianhaogutum/qawrench/blob/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# In-page anchors: PyPI does not generate heading ids
pattern = '\]\(#([^)\s]+)\)'
replacement = '](https://github.com/tianhaogutum/qawrench#\1)'

[tool.hatch.build.targets.wheel]
# Hatch ships every non-ignored file under src/qawrench/, including the package data
# a11y/schemas/*.schema.json (the SARIF output contracts of `qawrench a11y`).
packages = ["src/qawrench"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/licenses",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY.md",
    "/pyproject.toml",
]
exclude = ["__pycache__", "*.pyc", ".cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Correctness-focused set; the merged tools keep their original compact style.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Test modules re-export fixtures and helpers across sibling modules and keep a compact style.
"tests/**" = ["F401", "F811", "F841", "E402", "E701", "E702", "E731"]
"examples/**" = ["E402", "E701", "E702", "E731"]
